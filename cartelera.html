<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <title>Programación deportiva · SpinningTV</title>
  <meta name="description" content="Eventos deportivos disponibles en SpinningTV.">
  <meta name="theme-color" content="#07101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpinningTV">
  <link rel="manifest" href="manifest-cartelera.webmanifest?v=2">
  <link rel="icon" href="app-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="stylesheet" href="cartelera.css?v=20260912-tvplus5">
</head>
<body class="public-page no-copy">
  <header class="site-shell public-hero">
    <div class="public-brand-lockup">
      <img class="public-brand-logo" src="spinning-ibo-logo-transparent.png" alt="Spinning IBO" draggable="false">
    </div>
  </header>

  <main class="site-shell public-main">
    <div id="status" class="status-banner" role="status" aria-live="polite"></div>
    <section class="agenda-card">
      <div class="agenda-day">
        <span>Eventos del día</span>
        <h1 id="agendaDate">Cargando fecha…</h1>
        <div class="agenda-overview" aria-label="Resumen de la programación">
          <div class="agenda-stat agenda-stat-events">
            <strong id="eventCountSummary">—</strong>
            <span>Eventos</span>
          </div>
          <div class="agenda-stat agenda-stat-sports">
            <strong id="sportCountSummary">—</strong>
            <span>Deportes</span>
          </div>
        </div>
      </div>
      <section id="startedEvents" class="started-events" aria-labelledby="startedEventsTitle" hidden>
        <div class="started-events-heading">
          <h2 id="startedEventsTitle">Eventos iniciados</h2>
        </div>
        <div id="startedEventsList" class="started-events-list"></div>
      </section>
      <div id="agenda"><div class="empty-agenda">Cargando eventos…</div></div>
    </section>

  </main>

  <script src="config-cartelera.js?v=20260910"></script>
  <script src="cartelera-common.js?v=20260912-tvplus5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function () {
      "use strict";
      const config = window.SPINNINGTV_CONFIG || {};
      const agenda = document.getElementById("agenda");
      const status = document.getElementById("status");
      const agendaDate = document.getElementById("agendaDate");
      const eventCountSummary = document.getElementById("eventCountSummary");
      const sportCountSummary = document.getElementById("sportCountSummary");
      const startedEvents = document.getElementById("startedEvents");
      const startedEventsList = document.getElementById("startedEventsList");
      let lastRenderSignature = null;
      let db = null;

      function madridClock() {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Madrid",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(new Date());
        const value = function (type) {
          const match = parts.find(function (part) { return part.type === type; });
          return Number(match ? match.value : 0);
        };
        return { hour: value("hour"), minute: value("minute") };
      }

      function estimatedDuration(sport) {
        const value = String(sport || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        if (value.includes("futbol americano")) return 210;
        if (value.includes("futbol sala")) return 110;
        if (value.includes("futbol")) return 120;
        if (value.includes("baloncesto")) return 135;
        if (value.includes("tenis")) return 180;
        if (value.includes("padel")) return 150;
        if (value.includes("ciclismo")) return 300;
        if (value.includes("golf")) return 360;
        if (value.includes("motor")) return 150;
        if (value.includes("balonmano")) return 110;
        if (value.includes("rugby") || value.includes("hockey")) return 120;
        if (value.includes("voleibol")) return 150;
        if (value.includes("atletismo")) return 180;
        if (value.includes("boxeo") || value.includes("mma")) return 240;
        return 120;
      }

      function updateStartedEvents() {
        const clock = madridClock();
        const now = clock.hour * 60 + clock.minute;
        const rows = Array.from(agenda.querySelectorAll(".agenda-event[data-event-minutes]"))
          .map(function (row) {
            const group = row.closest(".agenda-sport-group");
            const heading = group ? group.querySelector(".agenda-sport-heading h3") : null;
            const sport = heading ? heading.textContent.trim() : "Otros deportes";
            const minutes = Number(row.dataset.eventMinutes);
            return { row: row, minutes: minutes, sport: sport, duration: estimatedDuration(sport) };
          })
          .filter(function (item) {
            return Number.isFinite(item.minutes) && item.minutes <= now && now < item.minutes + item.duration;
          })
          .sort(function (left, right) { return right.minutes - left.minutes; });

        startedEventsList.replaceChildren();
        startedEvents.hidden = !rows.length;
        rows.forEach(function (item) {
          const source = item.row;
          const card = document.createElement("article");
          card.className = "started-event-item";

          const time = document.createElement("time");
          time.textContent = (source.querySelector("time") || {}).textContent || "";

          const copy = document.createElement("div");
          copy.className = "started-event-copy";
          const statusLabel = document.createElement("span");
          statusLabel.className = "started-event-status";
          const statusDot = document.createElement("i");
          statusDot.setAttribute("aria-hidden", "true");
          statusLabel.append(statusDot, document.createTextNode("EN CURSO"));
          const title = document.createElement("strong");
          title.textContent = (source.querySelector(".agenda-event-title") || {}).textContent || "Evento deportivo";
          const meta = document.createElement("span");
          const competition = (source.querySelector(".agenda-event-competition") || {}).textContent || "";
          const channel = (source.querySelector(".agenda-channel-badge strong") || {}).textContent || "";
          meta.textContent = [item.sport, competition, channel].filter(Boolean).join(" · ");
          copy.append(statusLabel, title);
          if (meta.textContent) copy.appendChild(meta);

          card.append(time, copy);
          startedEventsList.appendChild(card);
        });
      }

      function updatePublicSummary() {
        const eventCount = agenda.querySelectorAll(".agenda-event").length;
        const sportCount = agenda.querySelectorAll(".agenda-sport-group").length;
        eventCountSummary.textContent = String(eventCount);
        sportCountSummary.textContent = String(sportCount);
        window.SpinningTV.updateNextEvent(agenda);
        updateStartedEvents();
      }

      async function loadAgenda() {
        if (!db) {
          status.textContent = "La cartelera todavía no está conectada.";
          status.className = "status-banner visible error";
          window.SpinningTV.renderAgenda("", agenda);
          return;
        }

        try {
          const result = await db
            .from("cartelera")
            .select("content, updated_at, event_updates")
            .eq("id", 1)
            .single();
          if (result.error) throw result.error;
          const content = String(result.data.content || "");
          const eventUpdates = result.data.event_updates && typeof result.data.event_updates === "object"
            ? result.data.event_updates
            : {};
          const renderSignature = content + "\n" + JSON.stringify(eventUpdates);
          if (renderSignature !== lastRenderSignature) {
            window.SpinningTV.renderAgenda(content, agenda, { eventUpdates: eventUpdates, highlightNext: true });
            lastRenderSignature = renderSignature;
          }
          updatePublicSummary();
          agendaDate.textContent = window.SpinningTV.formatAgendaDate(result.data.updated_at);
          status.className = "status-banner";
        } catch (error) {
          console.error(error);
          status.textContent = "No ha sido posible cargar la cartelera. Se volverá a intentar automáticamente.";
          status.className = "status-banner visible error";
        }
      }

      if (window.supabase && /^https:\/\/.+\.supabase\.co$/i.test(String(config.supabaseUrl || "")) && String(config.supabaseKey || "").length > 20) {
        db = window.supabase.createClient(
          String(config.supabaseUrl).replace(/\/$/, ""),
          String(config.supabaseKey),
          { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
        );
      }

      loadAgenda();
      const refreshMs = Math.max(15, Number(config.refreshSeconds) || 60) * 1000;
      setInterval(loadAgenda, refreshMs);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) loadAgenda();
      });

      ["copy", "cut", "contextmenu", "dragstart", "selectstart"].forEach(function (eventName) {
        document.addEventListener(eventName, function (event) {
          event.preventDefault();
        });
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./service-worker.js?v=14", { updateViaCache: "none" }).then(function (registration) {
            return registration.update();
          }).catch(function (error) {
            console.error("No se pudo activar el modo aplicación.", error);
          });
        });
      }
    })();
  </script>
</body>
</html>
